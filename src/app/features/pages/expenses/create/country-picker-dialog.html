<div class="currency-picker">
  <header class="currency-picker__header">
    <div>
      <h2>Choose Currency</h2>
      <p>Search by country, code, or currency name</p>
    </div>
    <button mat-icon-button type="button" aria-label="Close" (click)="close()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <mat-form-field appearance="outline" class="currency-picker__search">
    <mat-icon matPrefix aria-hidden="true">search</mat-icon>
    <input matInput [formControl]="searchControl" placeholder="Search currency" autocomplete="off" />
  </mat-form-field>

  <div class="currency-picker__list">
    @for (country of filteredCountries(); track country._id) {
      <button
        class="currency-picker__option"
        [class.currency-picker__option--selected]="country._id === data.selectedCountryId"
        type="button"
        (click)="selectCountry(country)"
      >
        <span class="currency-picker__symbol">{{ country.currency?.symbol || country.emoji }}</span>
        <span class="currency-picker__copy">
          <strong>{{ country.currency?.code || country.iso3 }}</strong>
          <span>{{ country.currency?.name || country.name }}</span>
        </span>
        @if (country._id === data.selectedCountryId) {
          <mat-icon aria-hidden="true">check</mat-icon>
        }
      </button>
    } @empty {
      <p class="currency-picker__empty">No matching currency found.</p>
    }
  </div>
</div>
