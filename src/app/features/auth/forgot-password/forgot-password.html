<mat-card class="forgot-card" appearance="outlined">
  <mat-card-content>
    <a class="back-link" routerLink="/auth/login">
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
      Back to login
    </a>

    <header>
      <h1>Reset password</h1>
      <p>Enter your email or phone number and we'll send reset instructions.</p>
    </header>

    <form class="reset-form">
      <mat-form-field appearance="outline">
        <mat-label>Email or phone</mat-label>
        <mat-icon matPrefix aria-hidden="true">alternate_email</mat-icon>
        <input matInput autocomplete="username" />
      </mat-form-field>

      <button mat-flat-button type="button">
        <mat-icon aria-hidden="true">send</mat-icon>
        Send reset link
      </button>
    </form>
  </mat-card-content>
</mat-card>
