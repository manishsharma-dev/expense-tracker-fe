<form [formGroup]="loginForm" class="login-form" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline">
    <mat-label>Phone number</mat-label>
    <mat-icon matPrefix aria-hidden="true">phone_iphone</mat-icon>
    <input
      matInput
      type="tel"
      name="phone"
      formControlName="phone"
      autocomplete="tel"
      placeholder="10 digit mobile number"
      required
    />
    @if (loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched) {
      <mat-error>Enter a valid 10 digit phone number</mat-error>
    }
  </mat-form-field>

  @if (loginError()) {
    <mat-error>{{ loginError() }}</mat-error>
  }

  <button mat-flat-button type="submit" class="submit-button">
    <mat-icon aria-hidden="true">sms</mat-icon>
    Continue with phone
  </button>
</form>
