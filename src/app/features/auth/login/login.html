<mat-card class="login-card d-flex flex-column align-items-center justify-content-center">
    <mat-card-header class="mb-3">
        <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="loginForm" class="d-flex flex-column align-items-center gap-2" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" name="email" formControlName="email" required>
            @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
                <mat-error>Enter a valid email address</mat-error>
            }
        </mat-form-field>
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" name="password" formControlName="password" required>
            @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
                <mat-error>Enter a valid password</mat-error>
            }
        </mat-form-field>
        <button matButton="elevated" color="primary" type="submit" class="full-width">Login</button>
        </form>
    </mat-card-content>
</mat-card>
