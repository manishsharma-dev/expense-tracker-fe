<mat-card class="login-card" appearance="outlined">
  <mat-card-content>
    <header class="login-header">
      <img
        class="login-logo login-logo--light"
        src="/assets/images/logo/logo_light_header.png"
        alt="Xpense"
        width="392"
        height="105"
      />
      <img
        class="login-logo login-logo--dark"
        src="/assets/images/logo/logo_dark_header.png"
        alt="Xpense"
        width="392"
        height="105"
      />
      <h1>Welcome back</h1>
      <p>Sign in to continue tracking your expenses.</p>
    </header>

    <div class="login-switch" role="tablist" aria-label="Login method">
      <button
        type="button"
        [class.login-switch__button--active]="currentLoginMethod() === LoginMethod.EMAIL"
        class="login-switch__button"
        (click)="setLogin(LoginMethod.EMAIL)"
      >
        <mat-icon aria-hidden="true">mail</mat-icon>
        Email
      </button>
      <button
        type="button"
        [class.login-switch__button--active]="currentLoginMethod() === LoginMethod.MOBILE"
        class="login-switch__button"
        (click)="setLogin(LoginMethod.MOBILE)"
      >
        <mat-icon aria-hidden="true">phone_iphone</mat-icon>
        Phone
      </button>
    </div>

    @switch(currentLoginMethod()) {
      @case(LoginMethod.EMAIL) {
        <app-email-login />
      }
      @default {
        <app-mobile-login />
      }
    }

    <div class="divider">
      <span>or continue with</span>
    </div>

    <div class="social-actions">
      <button mat-stroked-button type="button" class="social-button">
        <span class="social-mark">G</span>
        Google
      </button>
      <button mat-stroked-button type="button" class="social-button">
        <span class="social-mark social-mark--facebook">f</span>
        Facebook
      </button>
    </div>

    <p class="register-line">
      New to Xpense?
      <a routerLink="/auth/register">Create an account</a>
    </p>
  </mat-card-content>
</mat-card>
