<mat-card class="login-card d-flex flex-column align-items-center justify-content-center">
    <mat-card-header class="mb-3">
        <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content class="w-100">
        @switch(currentLoginMethod()){
            @case(LoginMethod.EMAIL){
                <app-email-login />
            }
            @default{
                <app-mobile-login />
            }
        }
    </mat-card-content>
    <mat-card-footer>
        <a>
            @switch(currentLoginMethod()){
                @case(LoginMethod.EMAIL){
                   <a ngSkipHydration (click)="setLogin(LoginMethod.MOBILE)">Login with mobilett</a> 
                }
                @default{
                    <a ngSkipHydration (click)="setLogin(LoginMethod.EMAIL)">Login with emailtt</a> 
                }
            }
        </a>
    </mat-card-footer>
</mat-card>
